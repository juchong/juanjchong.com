projects:
  - name: "DC34 Badge Motion Sensing"
    status: "Write-up"
    tagline: "Uses the DEF CON 34 badge's existing accelerometer to work out whether its wearer is walking, standing, sitting, or not wearing it, and draws the answer on the idle screen."
    url: "/posts/dc34-badge-motion-sensing/"
    image: "/images/dc34-badge-motion-sensing/dc34-badge-motion-sensing.png"
    tags: ["Embedded", "Rust", "Xous"]
    expanded: true
    details:
      - "Records labelled motion off the badge, trains a decision tree on a laptop, and compiles it back into the firmware. Inference runs on a RISC-V core with no floating-point unit."
      - "Adds a shared sampler and a CSV data logger, and fixes the interrupt configuration that let the screen blank while the badge was being worn."
    actions:
      - label: "Read the write-up"
        url: "/posts/dc34-badge-motion-sensing/"
        icon: "book"
      - label: "dc34-console"
        url: "https://github.com/juchong/dc34-console"
        icon: "github"

  - name: "QuestNav"
    status: "Active"
    tagline: "Turns a Meta Quest headset into a field localization sensor for FRC robots, streaming pose over NetworkTables."
    url: "https://questnav.gg/"
    image: "/images/questnav/QuestNavLogo-Dark.svg"
    imageFit: "contain"
    tags: ["FRC", "Unity", "Localization", "C#"]
    details:
      - "Uses the headset's visual-inertial odometry, cameras plus the built-in IMU, to track position in 3D space, then publishes pose to the robot over NT4 across a wired Ethernet link."
      - "Ships as a Unity app for the Quest plus a Java vendor dependency that feeds latency-compensated measurements into a swerve pose estimator."
      - "MIT licensed and actively released, with setup guides and API docs at questnav.gg."
    actions:
      - label: "questnav.gg"
        url: "https://questnav.gg/"
        icon: "link"
      - label: "Source"
        url: "https://github.com/QuestNav/QuestNav"
        icon: "github"

