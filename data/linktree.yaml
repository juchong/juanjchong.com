    status: "Ongoing"
    tagline: "Reverse engineering the Nintendo 64 JTAG debug interface to make tool-assisted speedruns repeatable on real hardware."
    url: "/posts/n64-tas-research/"
    image: "/images/n64/21-02-21_23-31-33_7169-min.jpg"
    tags: ["Hardware Hacking", "JTAG", "Consoles"]
    details:
      - "Probing the console's debug pins to understand how the CPU and RCP can be halted and inspected."
      - "Working with the TAS community to track down sources of desync between emulated and real runs."
    actions:
      - label: "Read the notes"
        url: "/posts/n64-tas-research/"
