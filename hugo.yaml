baseURL: "https://juanjchong.com"
languageCode: "en-us"
theme: "terminal"

pagination:
  pagerSize: 5

enableRobotsTXT: true

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

params:
  contentTypeName: "posts"
  showMenuItems: 3
  showLanguageSelector: false
  fullWidthTheme: false
  centerTheme: true
  autoCover: true
  showLastUpdated: false
  readingTime: true
  Toc: true
  TocTitle: "Table of Contents"

  twitter:
    creator: "juanjchong"
    site: "juanjchong"

languages:
  en:
    languageName: "English"
    title: "Juan Chong"
    params:
      subtitle: "Will navigate autonomously for food."
      owner: "Juan Chong"
      keywords: "MEMS, IMU, inertial sensors, robotics, engineering, Analog Devices"
      copyright: "Juan Chong"
      menuMore: "Show more"
      readMore: "Read more"
      readOtherPosts: "Read other posts"
      newerPosts: "Newer posts"
      olderPosts: "Older posts"
      missingContentMessage: "Page not found..."
      missingBackButtonLabel: "Back to home page"
      minuteReadingTime: "min read"
      words: "words"

      logo:
        logoText: "juan@chong ~$"
        logoHomeLink: "/"

    menu:
      main:
        - identifier: about
          name: "About"
          url: "/about"
          weight: 1
        - identifier: posts
          name: "Posts"
          url: "/posts"
          weight: 2
        - identifier: links
          name: "Links"
          url: "/links"
          weight: 3
